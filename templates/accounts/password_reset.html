
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | AURA</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f7f5f1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .reset-box {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.12);
        }

        .brand {
            text-align: center;
            font-size: 36px;
            letter-spacing: 8px;
            color: #171717;
            margin-bottom: 10px;
        }

        .tagline {
            text-align: center;
            font-size: 11px;
            letter-spacing: 3px;
            color: #888;
            margin-bottom: 40px;
        }

        h2 {
            text-align: center;
            color: #171717;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input:focus {
            border-color: #222;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            background: #171717;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        button:hover {
            background: #333;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
        }

    </style>

</head>

<body>

    <div class="reset-box">

        <div class="brand">
            AURA
        </div>

        <div class="tagline">
            THE ART OF FRAGRANCE
        </div>

        <h2>Forgot Password?</h2>

        <p class="description">
            Enter your registered email address and
            we'll help you reset your password.
        </p>

        <form method="POST">

            {% csrf_token %}

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">
                SEND RESET LINK
            </button>

        </form>

        <a
            href="{% url 'login' %}"
            class="back-login"
        >
            ← Back to Login
        </a>

        <a
            href="{% url 'home' %}"
            class="back-home"
        >
            Back to Home
        </a>

    </div>

</body>

</html>
