<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Password Reset | AURA</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        min-height: 100vh;
        background: #f7f5f1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .reset-wrapper {
        width: 100%;
        max-width: 850px;
        min-height: 500px;
        background: #ffffff;
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.12);
    }

    /* LEFT */

    .reset-banner {
        background: #171717;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 50px;
    }

    .brand {
        font-size: 42px;
        letter-spacing: 8px;
        margin-bottom: 15px;
    }

    .tagline {
        font-size: 13px;
        letter-spacing: 3px;
        color: #c9c9c9;
    }

    /* RIGHT */

    .reset-section {
        padding: 50px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        text-align: center;
    }

    .success-icon {
        font-size: 45px;
        margin-bottom: 20px;
    }

    .reset-section h2 {
        font-size: 28px;
        color: #171717;
        margin-bottom: 15px;
    }

    .reset-section p {
        color: #777;
        font-size: 14px;
        line-height: 1.7;
        margin-bottom: 30px;
    }

    .login-btn {
        display: block;
        width: 100%;
        padding: 15px;
        background: #171717;
        color: #ffffff;
        text-decoration: none;
        border-radius: 6px;
        font-size: 14px;
        letter-spacing: 1px;
        transition: 0.3s;
    }

    .login-btn:hover {
        background: #333;
    }

    .home-link {
        margin-top: 20px;
        color: #666;
        text-decoration: none;
        font-size: 13px;
    }

    .home-link:hover {
        color: #111;
        text-decoration: underline;
    }

    /* MOBILE */

    @media (max-width: 768px) {

        .reset-wrapper {
            grid-template-columns: 1fr;
            max-width: 500px;
        }

        .reset-banner {
            min-height: 200px;
            padding: 40px;
        }

        .brand {
            font-size: 32px;
        }

        .reset-section {
            padding: 40px 30px;
        }
    }
</style>


</head>

<body>


<div class="reset-wrapper">

    <!-- LEFT -->

    <div class="reset-banner">

        <div class="brand">
            AURA
        </div>

        <div class="tagline">
            THE ART OF FRAGRANCE
        </div>

    </div>


    <!-- RIGHT -->

    <div class="reset-section">

        <div class="success-icon">
            ✉️
        </div>

        <h2>
            Check Your Email
        </h2>

        <p>
            If an account exists with the email address you entered,
            we have generated a password reset link.
        </p>

        <a href="{% url 'login' %}" class="login-btn">
            BACK TO LOGIN
        </a>

        <a href="{% url 'home' %}" class="home-link">
            ← Back to Home
        </a>

    </div>

</div>


</body>

</html>
